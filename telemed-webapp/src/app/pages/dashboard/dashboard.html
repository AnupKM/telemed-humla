<div class="dashboard-container">
  <div class="welcome-banner">
    <h1>Welcome, {{ user()?.fullName }}!</h1>
    <p>Here is what's happening with our projects today.</p>
  </div>

  <div class="tab-wrapper">
    <nav class="tab-bar">
      <a [routerLink]="NAV.DASHBOARD.REGISTER" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}"
        class="tab-item">
        <span class="icon">📊</span> Patient entry
      </a>
      <a [routerLink]="NAV.DASHBOARD.RECORD" routerLinkActive="active" class="tab-item">
        <span class="icon">📁</span> Patient records
      </a>
      @if (showHistoryTab()) {
      <a [routerLink]="NAV.DASHBOARD.HISTORY.replace(':patientId', selectedPatient()?.id || '')"
        routerLinkActive="active" class="tab-item">
        <span class="icon">📜</span> Patient History
      </a>
      }
    </nav>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>
